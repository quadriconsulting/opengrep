[supervisord]
nodaemon=false
logfile=/home/user/webapp/supervisord.log
pidfile=/home/user/webapp/supervisord.pid
childlogdir=/home/user/webapp/logs

[unix_http_server]
file=/home/user/webapp/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:devsecure-dashboard]
command=python3 /home/user/webapp/simple_dashboard.py --port 5000 --host 0.0.0.0
directory=/home/user/webapp
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/logs/dashboard.log
stderr_logfile=/home/user/webapp/logs/dashboard_error.log
user=user
environment=PYTHONPATH="/home/user/webapp"